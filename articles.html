<head>

<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="apple-touch-icon" href="assets/img/favicon.png">
<!-- seo -->
<meta name="description" content="Practical guides on NMC referrals, investigations, hearings, reflective writing, insight and remediation — written by healthcare professionals with lived experience.">
<link rel="canonical" href="https://fit2practise.vercel.app/articles">

<meta property="og:type" content="website">

<meta property="og:title" content="Fitness to Practise Articles & Guides for Nurses | Fit 2 Practise">
<meta property="og:description" content="Practical guides on NMC referrals, investigations, hearings, reflective writing, insight and remediation — written by healthcare professionals with lived experience.">
<meta property="og:image" content="https://fit2practise.vercel.app/assets/img/logo-main.png">

<!-- /seo -->
<link rel="stylesheet" href="assets/css/site.css">
<script src="assets/js/cart.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/site.js"></script>
<script src="assets/js/posts.js"></script>
<style>
  @media (max-width:820px){ .ar-feat { flex-direction: column !important; } }
</style>
</head>
<body>
<div id="site-header" data-active="articles"></div>

<!-- Hero band: image + dark purple overlay -->
<section style="position:relative;background:linear-gradient(rgba(27,15,46,0.82),rgba(27,15,46,0.9)),url('assets/img/Group-Brainstorming-Graphic-2.jpg') center/cover;color:#fff;">
  <div style="max-width:1100px;margin:0 auto;padding:64px 24px 70px;text-align:center;">
    <div style="font-size:13.5px;color:rgba(255,255,255,0.7);margin-bottom:16px;"><a href="index.html" style="color:rgba(255,255,255,0.7);">Home</a> <span style="margin:0 6px;">›</span> <span style="color:#5BD6A0;font-weight:600;">Articles</span></div>
    <span style="display:inline-block;background:rgba(91,214,160,0.18);color:#5BD6A0;font-weight:700;font-size:12.5px;letter-spacing:0.06em;padding:7px 16px;border-radius:999px;">Insights &amp; Guidance</span>
    <h1 style="font-family:'Schibsted Grotesk';font-weight:800;letter-spacing:-0.025em;line-height:1.08;font-size:clamp(32px,4.6vw,52px);margin:18px 0 0;">Articles &amp; resources</h1>
    <p style="font-size:18px;line-height:1.6;color:rgba(255,255,255,0.85);margin:14px auto 0;max-width:600px;">Practical advice and lived experience to help you navigate the Fitness to Practise process with confidence.</p>
  </div>
</section>

<!-- Featured + grid (rendered from shared posts data) -->
<section style="background:#F4F0E6;">
  <div style="max-width:1200px;margin:0 auto;padding:56px 24px 20px;" id="featuredWrap"></div>
</section>
<section style="background:#F4F0E6;">
  <div style="max-width:1200px;margin:0 auto;padding:24px 24px 70px;">
    <div id="postGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px;"></div>
  </div>
</section>

<script>
(function () {
  var POSTS = window.F2P_POSTS, ORDER = window.F2P_POST_ORDER;
  function esc(x) { return String(x).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
  var featured = ORDER[0], rest = ORDER.slice(1);
  var f = POSTS[featured];
  document.getElementById('featuredWrap').innerHTML =
    '<a href="article.html?id=' + featured + '" class="lift ar-feat js-rv from-s" style="display:flex;gap:0;background:#fff;border:1px solid #ECE6DA;border-radius:24px;overflow:hidden;box-shadow:0 30px 70px -44px rgba(30,18,48,0.4);">' +
      '<div style="flex:1 1 460px;min-width:280px;"><img src="' + f.img + '" alt="' + esc(f.title) + '" style="width:100%;height:100%;min-height:300px;object-fit:cover;display:block;"></div>' +
      '<div style="flex:1 1 420px;min-width:280px;padding:42px 40px;display:flex;flex-direction:column;justify-content:center;">' +
        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;"><span style="background:#E7F2EC;color:#15724C;font-weight:700;font-size:12px;padding:5px 12px;border-radius:999px;">Featured</span><span style="font-size:13px;color:#9A92A4;">' + esc(f.read) + '</span></div>' +
        '<h2 style="font-family:\'Schibsted Grotesk\';font-weight:700;letter-spacing:-0.02em;line-height:1.15;font-size:clamp(24px,2.8vw,32px);margin:0;color:#20122F;">' + esc(f.title) + '</h2>' +
        '<p style="font-size:16px;line-height:1.6;color:#5C5369;margin:14px 0 22px;">' + esc(f.lead) + '</p>' +
        '<span style="font-weight:700;font-size:14.5px;color:#1C8A5E;">Read article →</span>' +
      '</div></a>';
  document.getElementById('postGrid').innerHTML = rest.map(function (k) {
    var p = POSTS[k];
    return '<a href="article.html?id=' + k + '" class="lift js-rv" style="display:flex;flex-direction:column;background:#fff;border:1px solid #ECE6DA;border-radius:22px;overflow:hidden;">' +
      '<img src="' + p.img + '" alt="' + esc(p.title) + '" style="width:100%;aspect-ratio:16/10;object-fit:cover;display:block;">' +
      '<div style="padding:20px 22px 24px;"><div style="display:flex;gap:9px;align-items:center;font-size:12.5px;color:#9A92A4;margin-bottom:10px;"><span style="color:#15724C;font-weight:700;">' + esc(p.cat) + '</span><span>·</span><span>' + esc(p.read) + '</span></div>' +
      '<h3 style="font-family:\'Schibsted Grotesk\';font-weight:700;font-size:19px;line-height:1.3;margin:0 0 8px;color:#20122F;">' + esc(p.title) + '</h3>' +
      '<p style="font-size:14.5px;line-height:1.55;color:#6B6275;margin:0;">' + esc(p.lead).slice(0, 130) + '…</p></div></a>';
  }).join('');
})();
</script>

<div id="site-footer"></div>
</body>
</html>
