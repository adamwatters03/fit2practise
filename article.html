<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Article | Fit 2 Practise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="apple-touch-icon" href="assets/img/favicon.png">
<!-- seo -->
<meta name="description" content="Practical Fitness to Practise guidance for nurses, midwives and healthcare professionals.">
<link rel="canonical" href="https://fit2practise.vercel.app/article">
<meta property="og:url" content="https://fit2practise.vercel.app/article">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Fit 2 Practise">
<meta property="og:title" content="Article | Fit 2 Practise">
<meta property="og:description" content="Practical Fitness to Practise guidance for nurses, midwives and healthcare professionals.">
<meta property="og:image" content="https://fit2practise.vercel.app/assets/img/logo-main.png">
<meta name="twitter:card" content="summary">
<!-- /seo -->
<link rel="stylesheet" href="assets/css/site.css">
<script src="assets/js/cart.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/site.js"></script>
<script src="assets/js/posts.js"></script>
<style>
  .prose p { font-size:17px; line-height:1.75; color:#3A2F4A; margin:0 0 18px; }
  .prose h2 { font-family:'Schibsted Grotesk'; font-weight:700; font-size:24px; color:#20122F; margin:34px 0 12px; }
  .prose ul { padding-left:22px; margin:0 0 18px; }
  .prose li { font-size:17px; line-height:1.7; color:#3A2F4A; margin:6px 0; }
</style>
</head>
<body>
<div id="site-header" data-active="articles"></div>

<article id="article"></article>

<div id="site-footer"></div>

<script>
(function () {
  var POSTS = window.F2P_POSTS;
  var ORDER = window.F2P_POST_ORDER;
  var IMG = 'assets/img/';

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }

  var id;
  try { id = new URLSearchParams(location.search).get('id'); } catch (e) {}
  if (!id || !POSTS[id]) id = ORDER[0];
  var post = POSTS[id];
  document.title = post.title + ' | Fit 2 Practise';
  // Dynamic SEO: description, canonical and Article structured data
  (function () {
    var head = document.head;
    var md = document.querySelector('meta[name="description"]');
    if (md) md.setAttribute('content', post.lead);
    var url = 'https://fit2practise.vercel.app/article?id=' + id;
    var canon = document.querySelector('link[rel="canonical"]');
    if (canon) canon.setAttribute('href', url);
    var ogu = document.querySelector('meta[property="og:url"]'); if (ogu) ogu.setAttribute('content', url);
    var ogt = document.querySelector('meta[property="og:title"]'); if (ogt) ogt.setAttribute('content', post.title);
    var ogd = document.querySelector('meta[property="og:description"]'); if (ogd) ogd.setAttribute('content', post.lead);
    var ld = document.createElement('script');
    ld.type = 'application/ld+json';
    ld.textContent = JSON.stringify({
      '@context': 'https://schema.org', '@type': 'Article',
      headline: post.title, description: post.lead, url: url,
      image: 'https://fit2practise.vercel.app/' + post.img,
      author: { '@type': 'Organization', name: 'Fit 2 Practise' },
      publisher: { '@type': 'Organization', name: 'Fit 2 Practise', logo: { '@type': 'ImageObject', url: 'https://fit2practise.vercel.app/assets/img/logo-mark.png' } }
    });
    head.appendChild(ld);
  })();

  var bodyHtml = post.body.map(function (b) {
    if (b[0] === 'h2') return '<h2>' + esc(b[1]) + '</h2>';
    if (b[0] === 'ul') return '<ul>' + b[1].map(function (li) { return '<li>' + esc(li) + '</li>'; }).join('') + '</ul>';
    if (b[0] === 'html') return b[1];
    return '<p>' + esc(b[1]) + '</p>';
  }).join('');

  var related = ORDER.filter(function (k) { return k !== id; }).slice(0, 3).map(function (k) {
    var p = POSTS[k];
    return '<a href="article.html?id=' + k + '" class="lift" style="display:flex;flex-direction:column;background:#fff;border:1px solid #ECE6DA;border-radius:20px;overflow:hidden;">' +
      '<img src="' + p.img + '" alt="" style="width:100%;aspect-ratio:16/10;object-fit:cover;display:block;">' +
      '<div style="padding:18px 20px 22px;"><div style="font-size:12.5px;color:#15724C;font-weight:700;margin-bottom:8px;">' + esc(p.cat) + '</div><h3 style="font-family:\'Schibsted Grotesk\';font-weight:700;font-size:17px;line-height:1.3;margin:0;color:#20122F;">' + esc(p.title) + '</h3></div></a>';
  }).join('');

  document.getElementById('article').innerHTML = '' +
    '<section style="position:relative;background:linear-gradient(rgba(27,15,46,0.72),rgba(27,15,46,0.88)),url(\'' + post.img + '\') center/cover;color:#fff;">' +
      '<div style="max-width:860px;margin:0 auto;padding:60px 24px 66px;text-align:center;">' +
        '<div style="font-size:13.5px;color:rgba(255,255,255,0.7);margin-bottom:16px;"><a href="index.html" style="color:rgba(255,255,255,0.7);">Home</a> <span style="margin:0 6px;">›</span> <a href="articles.html" style="color:rgba(255,255,255,0.7);">Articles</a> <span style="margin:0 6px;">›</span> <span style="color:#5BD6A0;font-weight:600;">' + esc(post.cat) + '</span></div>' +
        '<span style="display:inline-block;background:rgba(91,214,160,0.18);color:#5BD6A0;font-weight:700;font-size:12.5px;letter-spacing:0.06em;padding:7px 16px;border-radius:999px;">' + esc(post.cat) + ' · ' + esc(post.read) + '</span>' +
        '<h1 style="font-family:\'Schibsted Grotesk\';font-weight:800;letter-spacing:-0.025em;line-height:1.1;font-size:clamp(30px,4.2vw,46px);margin:18px auto 0;max-width:760px;">' + esc(post.title) + '</h1>' +
      '</div>' +
    '</section>' +
    '<section style="background:#F4F0E6;"><div style="max-width:760px;margin:0 auto;padding:52px 24px 40px;">' +
      '<div class="prose"><p style="font-size:19px;color:#20122F;font-weight:500;">' + esc(post.lead) + '</p>' + bodyHtml + '</div>' +
      '<div style="display:flex;align-items:center;gap:14px;margin-top:36px;padding-top:24px;border-top:1px solid #E7E1D4;">' +
        '<img src="' + IMG + 'cathryn.jpg" alt="Fit to Practise" style="width:48px;height:48px;border-radius:50%;object-fit:cover;">' +
        '<div><div style="font-family:\'Schibsted Grotesk\';font-weight:700;font-size:15px;color:#20122F;">The Fit to Practise team</div><div style="font-size:13px;color:#8A8194;">Healthcare professionals supporting your journey</div></div>' +
      '</div>' +
    '</div></section>' +
    '<section style="background:#F4F0E6;"><div style="max-width:1200px;margin:0 auto;padding:20px 24px 40px;">' +
      '<a href="articles.html" style="font-weight:600;font-size:14.5px;color:#1C8A5E;">← All articles</a>' +
      '<h2 style="font-family:\'Schibsted Grotesk\';font-weight:700;font-size:24px;margin:20px 0 18px;color:#20122F;">Keep reading</h2>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px;">' + related + '</div>' +
    '</div></section>' +
    '<section style="background:#F4F0E6;"><div style="max-width:1200px;margin:0 auto;padding:10px 24px 70px;">' +
      '<div style="background:linear-gradient(150deg,#1E9466,#0F6647);border-radius:24px;padding:42px;text-align:center;color:#fff;">' +
        '<h2 style="font-family:\'Schibsted Grotesk\';font-weight:800;font-size:clamp(24px,3vw,32px);margin:0;">Need support with your process?</h2>' +
        '<p style="font-size:16.5px;line-height:1.6;color:rgba(255,255,255,0.9);margin:12px auto 22px;max-width:520px;">Explore our clinically relevant courses or reach out for 1:1 mentorship from professionals who have been there.</p>' +
        '<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;"><a href="courses.html" class="btn" style="background:#fff;color:#15724C;font-weight:700;font-size:15px;padding:13px 26px;border-radius:999px;">Browse courses</a><a href="mentorship.html" class="btn" style="background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.3);color:#fff;font-weight:700;font-size:15px;padding:13px 26px;border-radius:999px;">Get mentorship</a></div>' +
      '</div>' +
    '</div></section>';
})();
</script>
</body>
</html>
