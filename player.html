<!DOCTYPE html>
<html lang="en">
<head>

<style>
  .pl-wrap { display: flex; gap: 24px; align-items: flex-start; }
  .pl-side { width: 320px; flex-shrink: 0; position: sticky; top: 90px; }
  .pl-step { display: flex; align-items: center; gap: 11px; padding: 12px 13px; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 14px; color: #20122F; transition: background .15s ease; }
  .pl-step:hover { background: #F1ECF4; }
  .pl-step.active { background: #1C8A5E; color: #fff; }
  .pl-step.active .pl-tag { color: rgba(255,255,255,0.8); }
  .pl-tag { font-size: 11px; color: #9A92A4; flex-shrink: 0; }
  .prose h1,.prose h2,.prose h3 { font-family: 'Schibsted Grotesk'; color: #20122F; line-height: 1.2; }
  .prose h2 { font-size: 24px; margin: 30px 0 12px; }
  .prose h3 { font-size: 19px; margin: 24px 0 10px; }
  .prose p, .prose li { font-size: 16.5px; line-height: 1.7; color: #3A2F4A; }
  .prose ul, .prose ol { padding-left: 22px; }
  .prose img { max-width: 100%; border-radius: 14px; }
  .prose a { color: #1C8A5E; font-weight: 600; }
  .prose iframe { width: 100%; aspect-ratio: 16/9; border: 0; border-radius: 14px; }
  .video-embed { width: 100%; aspect-ratio: 16/9; border: 0; border-radius: 16px; box-shadow: 0 26px 60px -34px rgba(30,18,48,0.5); margin: 10px 0 18px; }
  .prose blockquote { border-left: 4px solid #1C8A5E; background: #FBF9F4; margin: 18px 0; padding: 14px 20px; border-radius: 0 14px 14px 0; }
  .prose table { width: 100%; border-collapse: collapse; margin: 18px 0; font-size: 15px; }
  .prose th, .prose td { border: 1px solid #ECE6DA; padding: 10px 14px; text-align: left; }
  .prose th { background: #FBF9F4; font-weight: 700; }
  .prose pre, .prose .wp-block-preformatted { background: #FBF9F4; border: 1px solid #ECE6DA; border-radius: 14px; padding: 16px 20px; white-space: pre-wrap; font-family: 'Hanken Grotesk'; font-size: 15px; }
  .pdf-card { display: flex !important; align-items: center; gap: 15px; background: #fff; border: 1.5px solid #E7E1D4; border-radius: 18px; padding: 16px 20px; margin: 16px 0; text-decoration: none !important; transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
  .pdf-card:hover { transform: translateY(-3px); box-shadow: 0 2px 4px rgba(30,18,48,0.05), 0 20px 44px -22px rgba(28,138,94,0.35); border-color: rgba(28,138,94,0.45); }
  .pdf-card .pdf-ic { width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(140deg, #1E9466, #5B3E86); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 10px 22px -10px rgba(28,138,94,0.55); }
  .pdf-card .pdf-body { flex: 1; min-width: 0; }
  .pdf-card strong { display: block; color: #20122F; font-family: 'Schibsted Grotesk'; font-weight: 700; font-size: 15.5px; line-height: 1.3; }
  .pdf-card em { font-style: normal; font-size: 12.5px; color: #9A92A4; font-weight: 600; }
  .pdf-card .pdf-cta { flex-shrink: 0; background: #E7F2EC; color: #15724C; font-weight: 700; font-size: 13px; padding: 9px 18px; border-radius: 999px; transition: background .15s ease, color .15s ease; }
  .pdf-card:hover .pdf-cta { background: #1C8A5E; color: #fff; }
  /* video facade */
  .vfacade { position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 16px; overflow: hidden; cursor: pointer; margin: 10px 0 18px; background: linear-gradient(140deg, #2C1A4A 0%, #22123B 55%, #0F6647 130%); box-shadow: 0 26px 60px -34px rgba(30,18,48,0.55); outline-offset: 3px; }
  .vfacade-poster { position: absolute; inset: 0; background-size: cover; background-position: center; transition: transform .5s cubic-bezier(.16,1,.3,1); }
  .vfacade:hover .vfacade-poster { transform: scale(1.04); }
  .vfacade-shade { position: absolute; inset: 0; background: linear-gradient(rgba(27,15,46,0.18), rgba(27,15,46,0.5)); }
  .vfacade-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 76px; height: 76px; border-radius: 50%; background: #1C8A5E; display: flex; align-items: center; justify-content: center; box-shadow: 0 18px 44px -12px rgba(0,0,0,0.55), 0 0 0 10px rgba(255,255,255,0.16); transition: transform .2s ease, box-shadow .2s ease; }
  .vfacade-btn svg { margin-left: 5px; }
  .vfacade:hover .vfacade-btn { transform: translate(-50%, -50%) scale(1.09); box-shadow: 0 22px 54px -12px rgba(0,0,0,0.6), 0 0 0 14px rgba(255,255,255,0.2); }
  .vfacade-label { position: absolute; left: 18px; bottom: 15px; color: #fff; font-weight: 700; font-size: 13.5px; background: rgba(27,15,46,0.55); backdrop-filter: blur(6px); padding: 8px 15px; border-radius: 999px; }
  /* quiz */
  .qz-head { display: inline-flex; align-items: center; gap: 8px; background: #E7F2EC; color: #15724C; font-weight: 700; font-size: 13px; padding: 8px 16px; border-radius: 999px; margin-bottom: 6px; }
  .qz-q { background: #FBF9F4; border: 1px solid #F0EBE0; border-radius: 18px; padding: 22px 24px; margin: 16px 0; transition: border-color .2s ease; }
  .qz-q.qz-right { border-color: #9CD3B6; } .qz-q.qz-wrong { border-color: #E4B7B7; }
  .qz-title { font-weight: 700; font-size: 16.5px; color: #20122F; margin-bottom: 14px; line-height: 1.4; }
  .qz-hint { font-size: 12.5px; color: #9A92A4; margin: 0 0 8px; }
  .qz-opt { display: flex; align-items: center; gap: 12px; background: #fff; border: 1.5px solid #ECE6DA; border-radius: 13px; padding: 13px 16px; margin: 8px 0; cursor: pointer; font-size: 15px; color: #3A2F4A; transition: border-color .15s ease, background .15s ease; }
  .qz-opt:hover { border-color: #1C8A5E; }
  .qz-opt:has(input:checked) { border-color: #1C8A5E; background: #F2FAF6; }
  .qz-opt.is-correct { border-color: #1C8A5E; background: #E7F2EC; }
  .qz-opt.is-correct .qz-mark::after { content: '✓'; color: #15724C; font-weight: 800; }
  .qz-opt.is-wrong { border-color: #D98A8A; background: #FBEAEA; }
  .qz-opt.is-wrong .qz-mark::after { content: '✕'; color: #B0566A; font-weight: 800; }
  .qz-mark { margin-left: auto; }
  .qz-essay { width: 100%; border: 1.5px solid #ECE6DA; border-radius: 13px; padding: 14px 16px; font-family: 'Hanken Grotesk'; font-size: 15px; color: #20122F; background: #fff; outline: none; resize: vertical; }
  .qz-essay:focus { border-color: #1C8A5E; }
  .qz-fb { margin-top: 12px; padding: 11px 15px; border-radius: 11px; font-size: 14px; font-weight: 600; }
  .qz-fb.ok { background: #E7F2EC; color: #15724C; } .qz-fb.no { background: #FBEAEA; color: #8A2F3B; }
  @media (max-width: 900px) { .pl-wrap { flex-direction: column; } .pl-side { position: static; width: 100%; } }
</style>
</head>
<body>
<div id="site-header" data-active="mycourses"></div>

<section style="padding:30px 0 80px;">
  <div style="max-width:1240px;margin:0 auto;padding:0 24px;">
    <div id="plGate" style="display:none;background:#fff;border:1px solid #ECE6DA;border-radius:24px;padding:56px 32px;text-align:center;max-width:640px;margin:40px auto;">
      <div style="color:#1C8A5E;margin-bottom:12px;"><span data-icon="lock" data-size="44"></span></div>
      <h2 id="plGateTitle" style="font-family:'Schibsted Grotesk';font-weight:700;font-size:24px;margin:0 0 8px;color:#20122F;">Checking your access…</h2>
      <p id="plGateMsg" style="font-size:16px;color:#6B6275;margin:0 0 22px;"></p>
      <div id="plGateActions" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;"></div>
    </div>
    <div id="plApp" style="display:none;">
      <div style="font-size:13.5px;color:#9A92A4;margin-bottom:14px;"><a href="my-courses.html" style="color:#9A92A4;">My learning</a> <span style="margin:0 6px;">›</span> <span id="plCrumb" style="color:#1C8A5E;font-weight:600;"></span></div>
      <div class="pl-wrap">
        <aside class="pl-side">
          <div style="background:#fff;border:1px solid #ECE6DA;border-radius:20px;padding:16px;">
            <h3 id="plCourseTitle" style="font-family:'Schibsted Grotesk';font-weight:700;font-size:17px;margin:4px 6px 12px;color:#20122F;"></h3>
            <div style="margin:0 6px 14px;"><div style="height:8px;border-radius:999px;background:#EFEAE0;overflow:hidden;"><div id="plBar" style="height:100%;border-radius:999px;background:#1C8A5E;width:0%;"></div></div><div id="plPct" style="font-size:12.5px;font-weight:700;color:#15724C;margin-top:6px;">0% complete</div></div>
            <div id="plSteps" style="display:flex;flex-direction:column;gap:4px;"></div>
          </div>
        </aside>
        <main style="flex:1;min-width:0;">
          <div style="background:#fff;border:1px solid #ECE6DA;border-radius:22px;padding:32px 34px;">
            <div id="plStepTag" style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#1C8A5E;margin-bottom:6px;"></div>
            <h1 id="plStepTitle" style="font-family:'Schibsted Grotesk';font-weight:800;font-size:clamp(24px,3vw,32px);margin:0 0 18px;color:#20122F;"></h1>
            <div id="plContent" class="prose"></div>
            <div style="display:flex;justify-content:space-between;gap:12px;margin-top:34px;padding-top:22px;border-top:1px solid #F0EBE0;">
              <button id="plPrev" class="btn" style="background:#fff;border:1px solid #E0D9CC;color:#20122F;font-family:'Hanken Grotesk';font-weight:700;font-size:15px;padding:12px 24px;border-radius:999px;cursor:pointer;">← Previous</button>
              <button id="plNext" class="btn" style="background:#1C8A5E;border:none;color:#fff;font-family:'Hanken Grotesk';font-weight:700;font-size:15px;padding:12px 26px;border-radius:999px;cursor:pointer;box-shadow:0 12px 26px -12px rgba(28,138,94,0.6);">Mark complete &amp; continue →</button>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script>
(function () {
  var courseId;
  try { courseId = new URLSearchParams(location.search).get('c'); } catch (e) {}
  var course = courseId && window.F2P.courseById(courseId);
  var gate = document.getElementById('plGate');
  var app = document.getElementById('plApp');

  function showGate(title, msg, actions) {
    gate.style.display = 'block'; app.style.display = 'none';
    document.getElementById('plGateTitle').textContent = title;
    document.getElementById('plGateMsg').textContent = msg;
    document.getElementById('plGateActions').innerHTML = actions || '';
    if (window.F2PIconScan) window.F2PIconScan(gate);
  }
  if (!course) { showGate('Course not found', 'That course does not exist.', '<a href="courses.html" class="btn" style="background:#1C8A5E;color:#fff;font-weight:700;font-size:15px;padding:13px 26px;border-radius:999px;">Browse courses</a>'); return; }

  // Turn bare Vimeo/YouTube URLs (WordPress-style embeds) into players, strip
  // editor artifacts, and upgrade PDF links into download cards.
  function renderHtml(html) {
    html = (html || '').replace(/<!--[\s\S]*?-->/g, '');
    html = html.replace(/\sdata-(?:start|end|is-last-node|is-only-node)="[^"]*"/g, '');
    html = html.replace(/\[[a-z_]+[^\]]*\]/g, '');
    html = html.replace(/(?:<p[^>]*>)?\s*https:\/\/vimeo\.com\/(\d+)(?:\/([a-z0-9]+))?[^\s<]*\s*(?:<\/p>)?/gi, function (m, id, h) {
      var src = 'https://player.vimeo.com/video/' + id + '?' + (h ? 'h=' + h + '&' : '') + 'autoplay=1';
      return videoFacade(src, 'vimeo', id, h || '');
    });
    html = html.replace(/(?:<p[^>]*>)?\s*https:\/\/(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]+)[^\s<]*\s*(?:<\/p>)?/gi, function (m, id) {
      return videoFacade('https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1', 'youtube', id, '');
    });
    html = html.replace(/<a[^>]*href="([^"]+\.pdf)"[^>]*>([^<]*)<\/a>/gi, function (m, href, label) {
      var file = decodeURIComponent(href.split('/').pop());
      var pretty = (label || file.replace(/\.pdf$/i, '')).replace(/-/g, ' ').trim();
      return '<a href="' + href + '" download="' + file + '" class="pdf-card">' +
        '<span class="pdf-ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg></span>' +
        '<span class="pdf-body"><strong>' + pretty + '</strong><em>PDF · click to download</em></span>' +
        '<span class="pdf-cta">Download</span></a>';
    });
    return html;
  }

  function videoFacade(src, kind, id, hash) {
    var poster = kind === 'youtube' ? ' style="background-image:url(\'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg\')"' : '';
    return '<div class="vfacade" data-src="' + src + '" data-kind="' + kind + '" data-vid="' + id + '" data-vh="' + hash + '" role="button" tabindex="0" aria-label="Play video">' +
      '<div class="vfacade-poster"' + poster + '></div>' +
      '<div class="vfacade-shade"></div>' +
      '<span class="vfacade-btn"><svg viewBox="0 0 24 24" width="26" height="26" fill="#fff" aria-hidden="true"><path d="M8 5.2v13.6L19 12 8 5.2Z"/></svg></span>' +
      '<span class="vfacade-label">Watch lesson video</span>' +
    '</div>';
  }

  function initFacades(root) {
    Array.prototype.forEach.call(root.querySelectorAll('.vfacade'), function (f) {
      // Fetch the real Vimeo thumbnail for the poster (graceful if it fails).
      if (f.getAttribute('data-kind') === 'vimeo') {
        var vurl = 'https://vimeo.com/' + f.getAttribute('data-vid') + (f.getAttribute('data-vh') ? '/' + f.getAttribute('data-vh') : '');
        fetch('https://vimeo.com/api/oembed.json?url=' + encodeURIComponent(vurl) + '&width=1280')
          .then(function (r) { return r.json(); })
          .then(function (d) { if (d && d.thumbnail_url) f.querySelector('.vfacade-poster').style.backgroundImage = 'url("' + d.thumbnail_url + '")'; })
          .catch(function () {});
      }
      function play() {
        var ifr = document.createElement('iframe');
        ifr.className = 'video-embed';
        ifr.src = f.getAttribute('data-src');
        ifr.setAttribute('allow', 'autoplay; fullscreen; picture-in-picture');
        ifr.setAttribute('allowfullscreen', '');
        f.replaceWith(ifr);
      }
      f.addEventListener('click', play);
      f.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); play(); } });
    });
  }

  // ---------- interactive quiz ----------
  function renderQuiz(s, container) {
    var qs = s.questions || [];
    if (!qs.length) {
      container.innerHTML = '<p style="font-size:15px;color:#6B6275;">This quiz has no questions yet.</p>';
      return;
    }
    var state = qs.map(function () { return { picked: [], text: '' }; });
    var submitted = false;

    function optionHtml(q, qi) {
      if (q.type === 'essay') {
        return '<textarea data-qi="' + qi + '" class="qz-essay" rows="5" placeholder="Write your reflection here…"></textarea>';
      }
      var multi = q.type === 'multiple';
      return (multi ? '<p class="qz-hint">Select all that apply</p>' : '') +
        q.answers.map(function (a, ai) {
          return '<label class="qz-opt" data-qi="' + qi + '" data-ai="' + ai + '">' +
            '<input type="' + (multi ? 'checkbox' : 'radio') + '" name="q' + qi + '" value="' + ai + '" style="accent-color:#1C8A5E;width:18px;height:18px;flex-shrink:0;">' +
            '<span>' + a.text.replace(/</g, '&lt;') + '</span><span class="qz-mark"></span></label>';
        }).join('');
    }

    function paint() {
      var gradable = qs.filter(function (q) { return q.type !== 'essay'; }).length;
      container.innerHTML =
        '<div class="qz-head"><span data-icon="check" data-size="17"></span> ' + qs.length + ' questions' + (gradable ? ' · pass mark 70%' : '') + '</div>' +
        qs.map(function (q, qi) {
          return '<div class="qz-q" id="qzq' + qi + '"><div class="qz-title">Q' + (qi + 1) + '. ' + q.title.replace(/</g, '&lt;') + '</div>' +
            '<div class="qz-opts">' + optionHtml(q, qi) + '</div><div class="qz-fb" style="display:none;"></div></div>';
        }).join('') +
        '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:22px;">' +
          '<button id="qzSubmit" class="btn" style="background:#1C8A5E;border:none;color:#fff;font-family:\'Hanken Grotesk\';font-weight:700;font-size:15px;padding:13px 28px;border-radius:999px;cursor:pointer;box-shadow:0 12px 26px -12px rgba(28,138,94,0.6);">Check my answers</button>' +
          '<div id="qzScore" style="display:none;font-family:\'Schibsted Grotesk\';font-weight:800;font-size:18px;"></div>' +
        '</div>';
      if (window.F2PIconScan) window.F2PIconScan(container);
      initFacades(container);

      Array.prototype.forEach.call(container.querySelectorAll('.qz-opt input'), function (inp) {
        inp.addEventListener('change', function () {
          var qi = parseInt(inp.name.slice(1), 10);
          var picked = Array.prototype.filter.call(container.querySelectorAll('[name="q' + qi + '"]'), function (x) { return x.checked; })
            .map(function (x) { return parseInt(x.value, 10); });
          state[qi].picked = picked;
        });
      });
      Array.prototype.forEach.call(container.querySelectorAll('.qz-essay'), function (ta) {
        ta.addEventListener('input', function () { state[parseInt(ta.getAttribute('data-qi'), 10)].text = ta.value; });
      });
      container.querySelector('#qzSubmit').addEventListener('click', grade);
    }

    function grade() {
      if (submitted) { state = qs.map(function () { return { picked: [], text: '' }; }); submitted = false; paint(); return; }
      var right = 0, gradable = 0;
      qs.forEach(function (q, qi) {
        var qEl = container.querySelector('#qzq' + qi);
        var fb = qEl.querySelector('.qz-fb');
        if (q.type === 'essay') {
          fb.style.display = 'block'; fb.className = 'qz-fb ok';
          fb.textContent = 'Saved — reflective answers are for your own development.';
          return;
        }
        gradable++;
        var correctSet = q.answers.map(function (a, ai) { return a.correct ? ai : -1; }).filter(function (x) { return x >= 0; });
        var picked = state[qi].picked;
        var isRight = picked.length === correctSet.length && picked.every(function (p) { return correctSet.indexOf(p) >= 0; });
        if (isRight) right++;
        qEl.classList.add(isRight ? 'qz-right' : 'qz-wrong');
        Array.prototype.forEach.call(qEl.querySelectorAll('.qz-opt'), function (opt) {
          var ai = parseInt(opt.getAttribute('data-ai'), 10);
          if (correctSet.indexOf(ai) >= 0) opt.classList.add('is-correct');
          else if (picked.indexOf(ai) >= 0) opt.classList.add('is-wrong');
          opt.querySelector('input').disabled = true;
        });
        fb.style.display = 'block';
        fb.className = 'qz-fb ' + (isRight ? 'ok' : 'no');
        fb.textContent = isRight ? (q.correctMsg || 'Correct — well done!') : (q.incorrectMsg || 'Not quite. The correct answer is highlighted above.');
      });
      var pct = gradable ? Math.round((right / gradable) * 100) : 100;
      var passed = pct >= 70;
      var scoreEl = container.querySelector('#qzScore');
      scoreEl.style.display = 'block';
      scoreEl.style.color = passed ? '#15724C' : '#8A2F3B';
      scoreEl.textContent = 'Score: ' + right + '/' + gradable + ' (' + pct + '%)' + (passed ? ' — passed ✓' : ' — 70% needed, try again');
      var btn = container.querySelector('#qzSubmit');
      btn.textContent = 'Retake quiz';
      btn.style.background = '#271640';
      submitted = true;
      if (passed) {
        done[idx] = true;
        try { localStorage.setItem(DONE_KEY, JSON.stringify(done)); } catch (e) {}
        paintProgress(); renderSteps();
        document.getElementById('plNext').style.display = '';
      }
      scoreEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    paint();
  }

  var steps = [], idx = 0, done = {};
  var DONE_KEY = 'f2p_steps_' + courseId;
  try { done = JSON.parse(localStorage.getItem(DONE_KEY) || '{}'); } catch (e) {}

  function pct() {
    var n = steps.length || 1;
    var d = steps.filter(function (s, i) { return done[i]; }).length;
    return Math.round((d / n) * 100);
  }
  function paintProgress() {
    var p = pct();
    document.getElementById('plBar').style.width = p + '%';
    document.getElementById('plPct').textContent = p + '% complete';
    window.F2P.setProgress(courseId, p);
    if (window.F2PAuth) window.F2PAuth.saveProgress(courseId, p);
  }
  function renderSteps() {
    var el = document.getElementById('plSteps');
    el.innerHTML = steps.map(function (s, i) {
      var tag = s.type === 'quiz' ? 'Quiz' : (s.type === 'topic' ? 'Module' : 'Lesson');
      var mark = done[i] ? '✓ ' : '';
      return '<div class="pl-step' + (i === idx ? ' active' : '') + '" data-i="' + i + '"><span style="flex:1;">' + mark + s.title.replace(/</g, '&lt;') + '</span><span class="pl-tag">' + tag + '</span></div>';
    }).join('');
    Array.prototype.forEach.call(el.querySelectorAll('.pl-step'), function (d) {
      d.addEventListener('click', function () { idx = parseInt(d.getAttribute('data-i'), 10); show(); });
    });
  }
  function show() {
    var s = steps[idx];
    document.getElementById('plStepTag').textContent = (s.type === 'quiz' ? 'Quiz' : (s.type === 'topic' ? 'Module' : 'Lesson')) + ' · ' + (idx + 1) + ' of ' + steps.length;
    document.getElementById('plStepTitle').textContent = s.title;
    var c = document.getElementById('plContent');
    if (s.type === 'quiz') {
      renderQuiz(s, c);
    } else {
      c.innerHTML = renderHtml(s.html);
      initFacades(c);
    }
    document.getElementById('plPrev').style.visibility = idx === 0 ? 'hidden' : 'visible';
    var nextBtn = document.getElementById('plNext');
    nextBtn.style.display = s.type === 'quiz' && !done[idx] ? 'none' : '';
    nextBtn.textContent = idx === steps.length - 1 ? (done[idx] ? 'Course complete ✓' : 'Mark complete ✓') : (done[idx] ? 'Continue →' : 'Mark complete & continue →');
    renderSteps();
    window.scrollTo(0, 0);
  }

  document.getElementById('plPrev').addEventListener('click', function () { if (idx > 0) { idx--; show(); } });
  document.getElementById('plNext').addEventListener('click', function () {
    done[idx] = true;
    try { localStorage.setItem(DONE_KEY, JSON.stringify(done)); } catch (e) {}
    paintProgress();
    if (idx < steps.length - 1) { idx++; }
    show();
  });

  // ---- access flow ----
  // Local-only demo mode for development: renders sample content so the player
  // can be exercised without a database. Never active on the live site.
  var isLocalDev = /^(localhost|127\.)/.test(location.hostname);
  if (isLocalDev && new URLSearchParams(location.search).get('demo') === '1') {
    steps = [
      { type: 'lesson', title: 'Sample lesson', html: '<p data-start="1" data-end="2">Welcome to the demo lesson.</p> https://vimeo.com/1122468120/0a9ed31057?share=copy%20 <p>Read this <a href="https://example.com/file.pdf">Module PDF</a>.</p>' },
      { type: 'quiz', title: 'Sample quiz', questions: [
        { title: 'Two plus two equals?', type: 'single', answers: [{ text: 'Three', correct: false }, { text: 'Four', correct: true }], correctMsg: 'Spot on.', incorrectMsg: 'Try again.' },
        { title: 'Pick the primary colours', type: 'multiple', answers: [{ text: 'Red', correct: true }, { text: 'Green', correct: false }, { text: 'Blue', correct: true }] },
        { title: 'Reflect on your learning', type: 'essay', answers: [] }
      ] }
    ];
    document.getElementById('plCrumb').textContent = course.title;
    document.getElementById('plCourseTitle').textContent = course.title + ' (demo)';
    gate.style.display = 'none'; app.style.display = 'block';
    idx = 0; paintProgress(); show();
    return;
  }
  showGate('Checking your access…', 'One moment.');
  if (!window.F2PAuth || !window.F2PAuth.sb()) {
    showGate('Please log in', 'Log in to access your course.', '<a href="login.html?next=' + encodeURIComponent('player.html?c=' + courseId) + '" class="btn" style="background:#1C8A5E;color:#fff;font-weight:700;font-size:15px;padding:13px 26px;border-radius:999px;">Log in</a>');
    return;
  }
  window.F2PAuth.session().then(function (s) {
    if (!s) {
      showGate('Please log in', 'Log in with the email you used at checkout to access your course.',
        '<a href="login.html?next=' + encodeURIComponent('player.html?c=' + courseId) + '" class="btn" style="background:#1C8A5E;color:#fff;font-weight:700;font-size:15px;padding:13px 26px;border-radius:999px;">Log in</a>');
      return;
    }
    return window.F2PAuth.getContent(courseId).then(function (data) {
      if (!data || !data.steps || !data.steps.length) {
        showGate('Purchase required', 'This course isn\'t on your account yet. If you\'ve just paid, make sure you logged in with the same email you used at checkout.',
          '<a href="course.html?c=' + courseId + '" class="btn" style="background:#1C8A5E;color:#fff;font-weight:700;font-size:15px;padding:13px 26px;border-radius:999px;">View course</a>' +
          '<a href="contact.html" class="btn" style="background:#fff;border:1px solid #E0D9CC;color:#20122F;font-weight:700;font-size:15px;padding:13px 26px;border-radius:999px;">Get help</a>');
        return;
      }
      steps = data.steps;
      document.title = course.title + ' — Fit to Practise';
      document.getElementById('plCrumb').textContent = course.title;
      document.getElementById('plCourseTitle').textContent = course.title;
      gate.style.display = 'none'; app.style.display = 'block';
      // resume at first incomplete step
      idx = 0; while (idx < steps.length - 1 && done[idx]) idx++;
      paintProgress(); show();
    });
  });
})();
</script>
</body>
</html>
